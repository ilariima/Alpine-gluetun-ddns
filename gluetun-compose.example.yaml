services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
    env_file:
      - .env
      - endpoint.env

# Keep the WireGuard keys and the rest of the Gluetun configuration in .env.
# Keep only WIREGUARD_ENDPOINT_IP in endpoint.env.
